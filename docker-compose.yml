services:
  mongodb:
    image: mongo:7.0
    container_name: qr-platform-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-qr-platform}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qr-platform-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qr-platform-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:adminpassword@mongodb:27017/qr-platform?authSource=admin}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - qr-platform-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qr-platform-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:4000
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:${BACKEND_PORT:-4000}}
    depends_on:
      - backend
    networks:
      - qr-platform-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  qr-platform-network:
    driver: bridge
