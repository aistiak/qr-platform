version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: qr-platform-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: qr-platform
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qr-platform-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: qr-platform-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - FRONTEND_URL=http://localhost:3000
      - MONGODB_URI=mongodb://admin:adminpassword@mongodb:27017/qr-platform?authSource=admin
      - MCP_ENABLED=true
      - MCP_HTTP_ENABLED=true
      - MCP_HTTP_PATH=/mcp
      - MCP_STDIO_ENABLED=false
      # Optional default token for MCP tools if client does not pass apiToken
      # - MCP_API_TOKEN=${MCP_API_TOKEN}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - qr-platform-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: qr-platform-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - BACKEND_INTERNAL_URL=http://backend:4000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
      - NEXT_PUBLIC_BUGSINK_DSN=${NEXT_PUBLIC_BUGSINK_DSN:-http://e7daceb8d378431b9e76f3c5abe34758@bug.krftlabs.com/1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - qr-platform-network
    command: pnpm run dev

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  qr-platform-network:
    driver: bridge
